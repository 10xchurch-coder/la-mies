# Compila la app de Android (AAB para Google Play) en GitHub, sin gastar las compilaciones del plan gratis de Expo.
# Deja el archivo en la rama "tienda" (la-mies.aab) para subirlo a Google Play.
name: App Android (en GitHub)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-local
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Compilar acá
        run: |
          eas build --platform android --profile production --local --non-interactive --output la-mies.aab
          ls -la la-mies.aab
      # El archivo pesa más de 100 MB y GitHub no lo acepta en una rama: se deja como archivo de la publicación "tienda".
      - name: Dejar el AAB en la publicación tienda
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tienda >/dev/null 2>&1 || gh release create tienda --title "AAB para Google Play" --notes "El último archivo para subir a Google Play." --prerelease
          gh release upload tienda la-mies.aab --clobber
