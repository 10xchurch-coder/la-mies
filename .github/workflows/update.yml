# Manda los cambios de pantallas (JavaScript) directo a los teléfonos que ya tienen la app,
# sin reinstalar: la app los baja sola al abrirse y los usa la próxima vez que se abre.
# Solo sirve para la misma versión instalada (runtimeVersion = versión de la app). Si cambia algo
# nativo (permisos, módulos nuevos), hay que compilar de nuevo con "App Android" / "App iPhone".
name: Actualizar app

on:
  workflow_dispatch:
    inputs:
      mensaje:
        description: "Qué cambió"
        type: string
        default: "Mejoras"

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publicar para Android (canal preview) y iPhone (canal production)
        env:
          MSG: ${{ inputs.mensaje }}
        run: |
          eas update --channel preview --message "$MSG" --environment preview --non-interactive
          eas update --channel production --message "$MSG" --environment production --non-interactive
