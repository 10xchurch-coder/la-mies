# Arma la versión web de La Mies y la publica en GitHub Pages cada vez que se sube un cambio.
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web
      # GitHub Pages no conoce las direcciones internas de la app; con esta copia, recargar la página no da error.
      - run: cp dist/index.html dist/404.html
      # Se dejan también los archivos de la versión anterior: así, quien tenga la app abierta mientras se publica
      # no se queda con "Loading module ... failed" (la app además recarga sola si pasa).
      - run: cp -r dist/_expo fresh_expo
      - uses: actions/cache/restore@v4
        with:
          path: prev
          key: web-static-${{ github.run_id }}
          restore-keys: web-static-
      - run: if [ -d prev/_expo ]; then cp -rn prev/_expo/. dist/_expo/; fi
      - run: rm -rf prev && mkdir prev && mv fresh_expo prev/_expo
      - uses: actions/cache/save@v4
        with:
          path: prev
          key: web-static-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
